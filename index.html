<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Veni Vidi</title>

<!-- Social preview (shows up when the link is shared in iMessage, Discord, etc.) -->
<meta name="description" content="Pieces I love, with my own thoughts on each piece.">
<meta property="og:title" content="Veni Vidi">
<meta property="og:description" content="Pieces I love, with my own thoughts on each piece.">
<meta property="og:type" content="website">
<meta name="twitter:card" content="summary">
<meta name="twitter:title" content="Veni Vidi">
<meta name="twitter:description" content="Pieces I love, with my own thoughts on each piece.">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700&family=Hanken+Grotesk:wght@500;700;800&display=swap" rel="stylesheet">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="style.css">
</head>
<body class="intro-active">

  <!-- Intro / hero. main.js steps it through the animation by adding classes. -->
  <header id="intro" class="intro">
    <div class="intro-panel"></div>
    <div class="intro-art">
      <img id="intro-image" src="" alt="">
      <div class="intro-scrim"></div>
    </div>

    <h1 class="intro-word vv-mark" aria-label="Veni Vidi"><span class="vv-rule"></span><span class="vv-line"><span>VENI</span><svg class="vv-chev" viewBox="0 0 120 116" aria-hidden="true"><polygon points="0,0 60,70 120,0 109.5,0 66.6,50 23.7,0"></polygon><polygon points="0,46 60,116 120,46 109.5,46 66.6,96 23.7,46"></polygon></svg><span>VIDI</span></span><span class="vv-rule"></span></h1>

    <nav id="era-nav" class="era-nav" aria-label="Filter by era">
      <!-- Era buttons are inserted here by main.js -->
    </nav>

    <div class="intro-caption">
      <button id="intro-featured" class="intro-featured" type="button">
        <span class="intro-featured-label">Featured piece</span>
        <span id="intro-featured-title" class="intro-featured-title"></span>
      </button>
      <div class="intro-actions">
        <button id="intro-enter" class="intro-enter" type="button">Enter gallery ↓</button>
        <button id="intro-replay" class="intro-replay" type="button">↺ Replay intro</button>
      </div>
    </div>
  </header>

  <div class="controls">
    <a href="timeline.html" class="page-link">View as timeline →</a>
    <input
      type="text"
      id="search-input"
      class="search-input"
      placeholder="Search by title or artist…"
      aria-label="Search artworks"
    >
  </div>

  <main>
    <div id="gallery-grid" class="gallery-grid">
      <!-- Artwork tiles are inserted here by main.js -->
    </div>
    <p id="no-results" class="no-results" hidden>No pieces match your search.</p>
  </main>

  <!-- Modal / lightbox -->
  <div id="modal-overlay" class="modal-overlay" hidden>
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title">
      <button id="modal-close" class="modal-close" aria-label="Close">&times;</button>
      <button id="modal-prev" class="modal-nav modal-prev" aria-label="Previous artwork">&#8249;</button>
      <button id="modal-next" class="modal-nav modal-next" aria-label="Next artwork">&#8250;</button>
      <div class="modal-content">
        <div class="modal-image-wrap">
          <img id="modal-image" src="" alt="">
        </div>
        <div class="modal-text">
          <h2 id="modal-title"></h2>
          <p id="modal-meta" class="modal-meta"></p>
          <div id="modal-description" class="modal-description"></div>
        </div>
      </div>
    </div>
  </div>

  <footer id="site-footer" class="site-footer">
    <!-- Filled in by footer.js -->
  </footer>

  <script src="art.js"></script>
  <script src="modal.js"></script>
  <script src="footer.js"></script>
  <script src="main.js"></script>
</body>
</html>
